  <g transform="translate(84,86)">
    <rect x="30" y="0" width="42" height="42" rx="9" fill="none" stroke="#22262B" stroke-width="6.5" opacity=".34"/>
    <rect x="10" y="20" width="42" height="42" rx="9" fill="#22262B"/>
  </g>
  <text x="176" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27" fill="#22262B" font-weight="600">artifact-share</text>

  <text x="84" y="278" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="72" font-weight="600" fill="#22262B" letter-spacing="-1.6">Publish an HTML page.</text>
  <text x="84" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="72" font-weight="600" fill="#22262B" letter-spacing="-1.6">Get the <tspan fill="#C97A16">verdicts</tspan> back.</text>

  <text x="84" y="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" fill="#5C646E">Reviewers decide in the browser. Your agent reads the JSON.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23">
