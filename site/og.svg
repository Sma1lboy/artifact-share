<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F5F7"/>
  <rect x="0" y="0" width="1200" height="6" fill="#22262B"/>

  <g transform="translate(84,86)">
    <rect x="30" y="0" width="42" height="42" rx="9" fill="none" stroke="#22262B" stroke-width="6.5" opacity=".34"/>
    <rect x="10" y="20" width="42" height="42" rx="9" fill="#22262B"/>
  </g>
  <text x="176" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27" fill="#22262B" font-weight="600">artifact-share</text>

  <text x="84" y="278" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="70" font-weight="600" fill="#22262B" letter-spacing="-1.6">One <tspan fill="#C97A16">curl</tspan> from an HTML file</text>
  <text x="84" y="366" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="70" font-weight="600" fill="#22262B" letter-spacing="-1.6">to a link you can send.</text>

  <text x="84" y="438" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" fill="#5C646E">No account, no build step, nothing to install.</text>

