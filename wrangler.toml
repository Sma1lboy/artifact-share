name = "artifact-share"
main = "worker.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "share.sma1lboy.me", custom_domain = true },
]

# The landing page. The worker owns /share and /s/*; everything else
# (i.e. "/") falls through to these static files.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/share", "/share/*", "/s/*"]

[[kv_namespaces]]
binding = "SHARES"
id = "966ff12b8c5b4685b1b4742298c806e2"
